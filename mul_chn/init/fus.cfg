log		fus_wt.log
units		real
boundary	p p p
timestep	10.0
dielectric		80.0
neighbor		3.5 multi
neigh_modify	every 10 delay 0
special_bonds	lj/coul 0.0 1.0 1.0

atom_style	full
bond_style	harmonic
pair_style	hybrid/overlay tanh/power 15.0 lj/lambda 0.1 0.0 35.0

read_data	fus_wt.dat
include		fus_wt.par

thermo		100
thermo_style	custom step temp ke pe ebond eangle epair

minimize	1.0e-6	1.0e-8	1000	100000
velocity	all create 300 5725 rot yes dist gaussian
fix		balance all balance 1000 1.1 shift xyz 10 1.01

fix		npt all npt temp 300 300 1000.0 iso 1.0 100.0 1000.0
dump		dump all xtc 100 fus_wt.xtc
restart		10000 ./rst/fus_wt.rst
run		100000